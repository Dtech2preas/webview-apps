
<!DOCTYPE html>
<html>
<head>
    <title>Robustness Test</title>
    <style>
        .hidden { display: none; }
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 1px solid black; padding: 20px; background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <h1>Automation Test</h1>
    <button id="btn-show-modal">Show Login Modal (Delayed)</button>
    <div id="login-modal" class="hidden modal">
        <h2>Login</h2>
        <input type="text" name="username" placeholder="Username" /><br/><br/>
        <input type="password" name="password" placeholder="Password" /><br/><br/>
        <button id="btn-submit">Submit</button>
    </div>

    <script>
        document.getElementById('btn-show-modal').addEventListener('click', function() {
            setTimeout(function() {
                document.getElementById('login-modal').classList.remove('hidden');
            }, 3000); // 3 seconds delay
        });

        document.getElementById('btn-submit').addEventListener('click', function() {
            alert("Login Submitted!");
            window.location.href = "success.html";
        });
    </script>
</body>
</html>
