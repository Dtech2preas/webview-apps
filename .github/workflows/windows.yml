name: Build Windows Desktop App

on:
  push:
    branches: [ master ]

jobs:
  build:
    name: Build EXE
    runs-on: windows-latest

    steps:
      # 📦 Clone repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 🐍 Python setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 🔍 Install dependencies
      - name: Install dependencies
        run: |
          cd windows-app
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ⚙️ Build EXE
      - name: Build EXE with PyInstaller
        run: |
          cd windows-app
          pyinstaller --noconfirm --onedir --windowed --name DTECH_Engine main.py

      # 🧪 Debug (VERY IMPORTANT if anything fails)
      - name: Debug files
        run: |
          echo "=== ROOT ==="
          dir
          echo "=== WINDOWS-APP ==="
          dir windows-app
          echo "=== DIST ==="
          dir windows-app\dist
          echo "=== OUTPUT ==="
          dir windows-app\dist\DTECH_Engine

      # 📦 Create ZIP
      - name: Create ZIP
        run: |
          Compress-Archive -Path windows-app\dist\DTECH_Engine\* -DestinationPath windows-app\DTECH_Engine_Windows.zip

      # 🚀 Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTECH_Engine_Windows
          path: windows-app\DTECH_Engine_Windows.zip
          retention-days: 30